<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Subject Management - StudyPlanner</title>
    <link rel="stylesheet" href="styles.css">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
</head>
<body>
    <div class="app-container">
        <!-- Sidebar -->
        <aside class="sidebar">
            <div class="sidebar-header">
                <h1 class="logo">StudyPlanner</h1>
                <p class="subtitle">AI Learning Assistant</p>
            </div>
            <nav class="sidebar-nav">
                <ul>
                    <li><a href="#" class="nav-item">Dashboard</a></li>
                    <li><a href="#" class="nav-item active">Subjects</a></li>
                    <li><a href="#" class="nav-item">Planner</a></li>
                    <li><a href="#" class="nav-item">Calendar</a></li>
                    <li><a href="#" class="nav-item">Progress</a></li>
                </ul>
            </nav>
        </aside>

        <!-- Main Content -->
        <main class="main-content">
            <!-- Header -->
            <header class="top-header">
                <div class="header-titles">
                    <h2>Subject Management</h2>
                    <p>Manage your subjects, chapters and exam dates.</p>
                </div>
                <button id="addSubjectBtn" class="btn btn-primary">+ Add Subject</button>
            </header>

            <!-- Statistics Cards -->
            <section class="stats-container">
                <div class="stat-card">
                    <h3>Total Subjects</h3>
                    <p class="stat-value" id="stat-total-subjects">0</p>
                </div>
                <div class="stat-card">
                    <h3>Total Chapters</h3>
                    <p class="stat-value" id="stat-total-chapters">0</p>
                </div>
                <div class="stat-card">
                    <h3>Upcoming Exams</h3>
                    <p class="stat-value" id="stat-upcoming-exams">0</p>
                </div>
            </section>

            <!-- Search -->
            <section class="search-section">
                <input type="text" id="searchInput" class="search-input" placeholder="Search subjects...">
            </section>

            <!-- Subject Grid -->
            <section class="subjects-grid" id="subjectsGrid">
                <!-- Subjects will be dynamically injected here -->
            </section>
        </main>
    </div>

    <!-- Modal for Add/Edit Subject -->
    <div id="subjectModal" class="modal-overlay">
        <div class="modal-content">
            <div class="modal-header">
                <h3 id="modalTitle">Add Subject</h3>
                <button id="closeModalIcon" class="close-btn">&times;</button>
            </div>
            <div class="modal-body">
                <form id="subjectForm">
                    <input type="hidden" id="subjectId">
                    
                    <div class="form-group">
                        <label for="subjectName">Subject Name</label>
                        <input type="text" id="subjectName" placeholder="Example: Data Structures" required>
                    </div>

                    <div class="form-group">
                        <label for="subjectChapters">Chapters (comma separated)</label>
                        <textarea id="subjectChapters" placeholder="Arrays, Linked List, Stack, Queue, Trees" rows="4" required></textarea>
                    </div>

                    <div class="form-group">
                        <label for="subjectDifficulty">Difficulty</label>
                        <select id="subjectDifficulty" required>
                            <option value="" disabled selected>Select difficulty</option>
                            <option value="Easy">Easy</option>
                            <option value="Medium">Medium</option>
                            <option value="Hard">Hard</option>
                        </select>
                    </div>

                    <div class="form-group">
                        <label for="subjectExamDate">Exam Date</label>
                        <input type="date" id="subjectExamDate" required>
                    </div>

                    <div id="formError" class="form-error"></div>

                    <div class="modal-footer">
                        <button type="button" id="cancelModalBtn" class="btn btn-secondary">Cancel</button>
                        <button type="submit" class="btn btn-primary">Save Subject</button>
                    </div>
                </form>
            </div>
        </div>
    </div>

    <script src="app.js"></script>
</body>
</html>
